name: CI

# Red de seguridad: lint, build y las tres suites de pruebas (unidad, reglas y
# funciones) en cada push a las ramas principales y en cada pull request.
# Las suites de reglas y funciones corren contra el emulador con el proyecto
# `demo-schoolify`, asi que no usan credenciales ni tocan la base real.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore es Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      # Se instala el CLI global (el paquete `firebase` del proyecto es el SDK web).
      - name: Install firebase CLI
        run: npm install -g firebase-tools@15

      - name: Cache firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Lint app
        run: npm run lint

      - name: Lint functions
        run: npm --prefix functions run lint

      - name: Build app
        run: npm run build

      - name: Use the runner's Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm run test:unit

      - name: Rules tests (firestore emulator)
        run: npm run test:rules

      - name: Functions tests (firestore + functions emulators)
        run: npm run test:functions
