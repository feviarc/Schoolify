<ion-app>

  <app-main-menu></app-main-menu>

  <ion-toast
   color="warning"
   message="¡Nueva versión disponible!"
   [buttons]="toastButtons"
   [isOpen]="!!(updateAvailable$ | async)"
  >
  </ion-toast>

  <ion-toast
   color="danger"
   [message]="sessionMessage ?? ''"
   [isOpen]="!!sessionMessage"
   [duration]="5000"
   (didDismiss)="sessionMessage = null"
  >
  </ion-toast>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
