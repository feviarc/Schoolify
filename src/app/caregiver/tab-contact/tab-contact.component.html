<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Contacto</ion-title>
    @if(isLoading) {
      <ion-progress-bar type="indeterminate" color="warning"></ion-progress-bar>
    }
  </ion-toolbar>
</ion-header>
<ion-content>
<div class="container-center">
    <ion-card class="school-card">
      <ion-card-content>
        @if(telefono) {
          <p class="phone-number">{{ telefonoFormateado }}</p>
          <div class="button-wrapper">
            <a href="tel:+52{{telefonoDigitos}}" class="btn-call">
              <ion-icon name="call"></ion-icon>
            </a>
          </div>
          <p class="tap-instruction">Presiona para llamar a la escuela</p>
        }
        @else {
          <p class="tap-instruction">
            El prefecto de tu escuela todavía no ha registrado un teléfono de contacto.
          </p>
        }
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
